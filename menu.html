<!DOCTYPE html>
<html data-wf-page="menu" data-wf-site="691c824788377ae224b4cf95">
<head>
  <meta charset="utf-8">
  <title>Menu — Irmak's Restaurant</title>
  <meta content="View our full menu at Irmak's Restaurant" name="description">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="css/normalize.css" rel="stylesheet" type="text/css">
  <link href="css/webflow.css" rel="stylesheet" type="text/css">
  <link href="css/irmaks.webflow.css" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
  <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js" type="text/javascript"></script>
  <script type="text/javascript">WebFont.load({  google: {    families: ["Open Sans:300,300italic,400,400italic,600,600italic,700,700italic,800,800italic","Inter:300,400,500,600,700"]  }});</script>
  <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon">
  <link href="images/webclip.png" rel="apple-touch-icon">
  <style>
    .menu-page-wrapper {
      background-color: var(--primary, #1a2e45);
      min-height: 100vh;
      padding: 40px 20px 60px;
    }
    .menu-page-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .menu-page-title {
      color: #c9a84c;
      font-family: 'Open Sans', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      margin: 0 0 8px;
    }
    .menu-page-subtitle {
      color: rgba(255,255,255,0.6);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      margin: 0 0 20px;
    }
    .menu-pdf-container {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .menu-pdf-container embed,
    .menu-pdf-container iframe {
      width: 100%;
      height: 85vh;
      min-height: 600px;
      border: none;
      display: block;
    }
    .menu-pdf-fallback {
      padding: 40px;
      text-align: center;
      color: #333;
      font-family: 'Inter', sans-serif;
    }
    .menu-pdf-fallback a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 28px;
      background: #1a2e45;
      color: #c9a84c;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.7);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      text-decoration: none;
      transition: color 0.2s;
      margin-bottom: 24px;
    }
    .back-link:hover { color: #c9a84c; }
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 10px 24px;
      background: #c9a84c;
      color: #1a2e45;
      text-decoration: none;
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.875rem;
    }
    .download-btn:hover { background: #e0bb5f; }
  </style>
</head>
<body class="body">
  <div data-animation="default" data-collapse="medium" data-duration="400" data-easing="ease" data-easing2="ease" role="banner" class="navbar w-nav">
    <div class="nav-container">
      <div class="nav-banner">
        <div class="nav-banner-container">
          <div class="details-wrapper flex">
            <div class="small-text">Call Us:</div>
            <a href="tel:01224023161" class="contact-details-linklink no-underline">01224 023161</a>
          </div>
        </div>
      </div>
      <div class="main-nav-container">
        <a href="index.html" class="brand w-nav-brand">
          <img src="images/imrak-logo.png" loading="lazy" alt="Irmak Restaurant Logo" class="nav-logo">
        </a>
        <nav role="navigation" class="nav-menu w-nav-menu">
          <a href="index.html" class="nav-link w-nav-link">Home</a>
          <a href="index.html#about-us" class="nav-link w-nav-link">About</a>
          <a href="index.html#Menu" class="nav-link w-nav-link">Menu</a>
          <a href="jobs.html" class="nav-link w-nav-link">Jobs</a>
          <a data-wf--button-cta--variant="base" href="index.html#Contact-Us" class="button-cta w-inline-block">
            <div class="button-text">Contact Us</div>
          </a>
        </nav>
        <div class="menu-button w-nav-button">
          <div class="icon w-icon-nav-menu"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="menu-page-wrapper">
    <div class="menu-page-header">
      <a href="index.html#Menu" class="back-link">← Back to Home</a>
      <h1 class="menu-page-title">Our Menu</h1>
      <p class="menu-page-subtitle">Bold, Fresh &amp; Truly Turkish</p>
    </div>

    <div class="menu-pdf-container">
      <embed src="documents/menu.pdf" type="application/pdf">
      <div class="menu-pdf-fallback" style="display:none">
        <p>Your browser cannot display PDFs inline.</p>
        <a href="documents/menu.pdf" download>Download Menu PDF</a>
      </div>
    </div>

    <div style="text-align:center">
      <a href="documents/menu.pdf" download class="download-btn">↓ Download Menu</a>
    </div>
  </div>

  <script>
    // Show fallback if embed fails to load (mobile browsers)
    const embed = document.querySelector('.menu-pdf-container embed');
    const fallback = document.querySelector('.menu-pdf-fallback');
    if (embed) {
      embed.onerror = function() {
        embed.style.display = 'none';
        fallback.style.display = 'block';
      };
      // On iOS/mobile, embed often silently fails — swap to fallback after a short delay
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        embed.style.display = 'none';
        fallback.style.display = 'block';
      }
    }
  </script>

  <script src="js/webflow.js" type="text/javascript"></script>
</body>
</html>
